<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Stock Opname - Rinra</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #10b981;
            --success-hover: #059669;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --background: #f8fafc;
            --surface: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--background); color: var(--text-main); padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 1400px; background: var(--surface); padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        header { margin-bottom: 24px; border-bottom: 2px solid var(--border); padding-bottom: 16px; }
        h1 { font-size: 24px; color: #0f172a; margin-bottom: 4px; }
        .update-info { font-size: 13px; color: var(--text-muted); }
        .toolbar { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; align-items: center; justify-content: space-between; }
        .search-box { flex: 1; min-width: 280px; }
        .search-box input { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; outline: none; }
        .search-box input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 243, 0.1); }
        .button-group { display: flex; flex-wrap: wrap; gap: 8px; }
        button, .btn-link { padding: 10px 16px; border: none; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s; text-decoration: none; }
        button:active { transform: scale(0.98); }
        .btn-primary { background-color: var(--primary); color: white; }
        .btn-primary:hover { background-color: var(--primary-hover); }
        .btn-success { background-color: var(--success); color: white; }
        .btn-success:hover { background-color: var(--success-hover); }
        .btn-danger { background-color: var(--danger); color: white; }
        .btn-danger:hover { background-color: var(--danger-hover); }
        .btn-amber { background-color: #f59e0b; color: white; }
        .btn-amber:hover { background-color: #d97706; }
        
        .table-container { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
        th { background-color: #f1f5f9; color: #475569; font-weight: 600; padding: 12px 16px; border-bottom: 1px solid var(--border); white-space: nowrap; }
        td { padding: 12px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
        tr:hover { background-color: #f8fafc; }
        
        .input-fisik { width: 80px; padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 14px; font-weight: 600; text-align: center; outline: none; }
        .input-remarks { width: 180px; padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 13px; outline: none; }

        .kolom-selisih { font-weight: 600; text-align: center; font-size: 14px; }
        .diff-zero { color: var(--text-muted); }
        .diff-plus { color: #059669; background-color: #ecfdf5; border-radius: 4px; padding: 2px 6px; }
        .diff-minus { color: #dc2626; background-color: #fef2f2; border-radius: 4px; padding: 2px 6px; }
        
        /* Kontainer pratinjau gambar + tombol hapus */
        .wrapper-foto { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 60px; }
        .img-preview {
            width: 45px; height: 45px; border-radius: 6px; object-fit: cover;
            border: 1px solid var(--border); cursor: pointer; transition: transform 0.2s;
        }
        .img-preview:hover { transform: scale(1.1); }
        .btn-hapus-foto {
            background: none; border: none; color: var(--danger); font-size: 10px; 
            font-weight: bold; cursor: pointer; padding: 2px 6px; border-radius: 4px;
        }
        .btn-hapus-foto:hover { background-color: #fef2f2; }
        
        .upload-label {
            padding: 5px 10px; background-color: #f1f5f9; border: 1px solid var(--border);
            border-radius: 6px; font-size: 12px; cursor: pointer; color: var(--text-main); font-weight: 500;
            display: inline-flex; align-items: center; gap: 4px;
        }
        .upload-label:hover { background-color: #e2e8f0; }

        .btn-link { padding: 4px 8px; font-size: 12px; background-color: #f1f5f9; color: var(--primary); border: 1px solid var(--border); }
        .pagination { display: flex; align-items: center; justify-content: space-between; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
        .page-info { font-size: 14px; color: var(--text-muted); }
        .page-buttons { display: flex; gap: 8px; }
        .btn-page { padding: 6px 12px; background-color: #ffffff; border: 1px solid var(--border); color: var(--text-main); }
        .btn-page:disabled { opacity: 0.5; cursor: not-allowed; }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.4); justify-content: center; align-items: center; z-index: 9999;
        }
        .modal-content {
            background: white; padding: 24px; border-radius: 12px; width: 100%; max-width: 450px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
        }
        .modal-content h3 { margin-bottom: 16px; font-size: 18px; color: #0f172a; }
        .form-group { margin-bottom: 12px; display: flex; flex-direction: column; gap: 4px; }
        .form-group label { font-size: 13px; font-weight: 600; color: #475569; }
        .form-group input { padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; outline: none; }
        .modal-buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Sistem Stock Opname Rinra</h1>
            <div class="update-info" id="updateDate">Menghubungkan ke cloud...</div>
        </header>

        <div class="toolbar">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Cari berdasarkan Part No atau Deskripsi Barang...">
            </div>
            <div class="button-group">
                <button class="btn-amber" id="btnOpenModal">➕ Tambah Data Manual</button>
                <button class="btn-primary" id="btnPaste">📥 Paste Data Excel</button>
                <button class="btn-success" id="btnCopy">📋 Salin Hasil Opname</button>
                <button class="btn-danger" id="btnReset">🗑️ Kosongkan Cloud</button>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Part No.</th>
                        <th style="text-align: center;">Foto Item</th>
                        <th>Deskripsi Barang</th>
                        <th>Group Name</th>
                        <th>Item Type</th>
                        <th>Unit</th>
                        <th style="text-align: center;">Stok Sistem</th>
                        <th style="text-align: center;">Fisik</th>
                        <th style="text-align: center;">Selisih</th>
                        <th>Remarks / Keterangan</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="11" style="text-align:center; padding:30px; color:#94a3b8;">Menghubungkan ke server cloud...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="pagination">
            <div class="page-info" id="pageInfo">Menampilkan 0-0 dari 0 item</div>
            <div class="page-buttons">
                <button class="btn-page" id="btnPrev" disabled>◀ Sebelumnya</button>
                <button class="btn-page" id="btnNext" disabled>Berikutnya ▶</button>
            </div>
        </div>
    </div>

    <div class="modal" id="addModal">
        <div class="modal-content">
            <h3>Tambah Item Inventaris Baru</h3>
            <div class="form-group"><label>Part No.</label><input type="text" id="formPartNo" placeholder="Contoh: M3050099"></div>
            <div class="form-group"><label>Deskripsi Barang</label><input type="text" id="formDeskripsi" placeholder="Contoh: Kertas HVS A4"></div>
            <div class="form-group"><label>Group Name</label><input type="text" id="formGroup" placeholder="Contoh: Printing & Stationary"></div>
            <div class="form-group"><label>Item Type</label><input type="text" id="formType" value="Material"></div>
            <div class="form-group"><label>Unit</label><input type="text" id="formUnit" placeholder="Contoh: Pcs / Pack / Rim"></div>
            <div class="form-group"><label>Stok Sistem (On Hand)</label><input type="number" id="formSistem" value="0"></div>
            <div class="modal-buttons">
                <button class="btn btn-danger" style="padding:8px 14px;" id="btnCloseModal">Batal</button>
                <button class="btn btn-success" style="padding:8px 14px;" id="btnSaveModal">Simpan</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBCmlVCm69mAJP0m8DoojN1uus9XMuwgEk",
            authDomain: "opname-rinra.firebaseapp.com",
            databaseURL: "https://opname-rinra-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "opname-rinra",
            storageBucket: "opname-rinra.firebasestorage.app",
            messagingSenderId: "454143552303",
            appId: "1:454143552303:web:7055d7625c9aaaebf50fda",
            measurementId: "G-GFFZJLLWMW"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // =========================================================================
        // PENGATURAN AKUN CLOUDINARY KANDA (Wajib Diisi):
        // =========================================================================
        const CLOUDINARY_CLOUD_NAME = "dvrpyvkyc"; 
        const CLOUDINARY_UPLOAD_PRESET = "preset";
        const CLOUDINARY_API_KEY = "279871863653533";       // Diperlukan untuk validasi hapus
        const CLOUDINARY_API_SECRET = "QOdzzQlQKqE7_52nq-qUAF6GDD0"; // Diperlukan untuk generate signature hapus

        let inventoryData = [];
        let filteredData = [];
        let firebaseTimeouts = {}; 
        let currentPage = 1;
        const rowsPerPage = 50; 
        let isInitialLoad = true; 

        const dbRef = ref(db, 'inventory_root');
        onValue(dbRef, (snapshot) => {
            const dataRaw = snapshot.val();
            if (dataRaw && dataRaw.items) {
                inventoryData = dataRaw.items;
                if (isInitialLoad) {
                    applySearchAndRender();
                    isInitialLoad = false;
                } else {
                    refreshActiveDataOnly();
                }
                if (dataRaw.lastUpdate) {
                    document.getElementById('updateDate').innerText = `Terakhir diperbarui: ${dataRaw.lastUpdate}`;
                }
            } else {
                inventoryData = []; filteredData = [];
                document.getElementById('tableBody').innerHTML = `<tr><td colspan="11" style="text-align:center; padding:30px; color:#94a3b8;">Cloud kosong. Silakan paste data teks inventaris Anda.</td></tr>`;
                document.getElementById('updateDate').innerText = "Terakhir diperbarui: Belum ada data di cloud";
                updatePaginationControls();
            }
        });

        function renderTablePage(shouldFocusFirstRow = false) {
            const tbody = document.getElementById('tableBody');
            if (filteredData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="11" style="text-align:center; padding:20px; color:#94a3b8;">Data tidak ditemukan</td></tr>`;
                document.getElementById('pageInfo').innerText = "Menampilkan 0 dari 0 item";
                return;
            }

            const start = (currentPage - 1) * rowsPerPage;
            const end = start + rowsPerPage;
            const pageItems = filteredData.slice(start, end);
            const fragment = document.createDocumentFragment();

            pageItems.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.setAttribute('data-original-index', item.originalIndex);
                tr.setAttribute('data-page-row-index', index);

                let diffClass = "diff-zero"; let diffText = "0";
                if (item.fisik !== undefined && item.fisik !== null && item.fisik !== "") {
                    const selisih = item.fisik - item.sistem;
                    if (selisih < 0) { diffClass = "diff-minus"; diffText = selisih; }
                    else if (selisih > 0) { diffClass = "diff-plus"; diffText = "+" + selisih; }
                }

                const staticUrl = `https://www.google.com/search?tbm=isch&q=${encodeURIComponent(item.deskripsi)}`;
                const fisikVal = (item.fisik !== undefined && item.fisik !== null) ? item.fisik : "";
                const remarksVal = item.remarks ? item.remarks : "";

                let imageColumnHtml = "";
                if (item.imageUrl) {
                    // Dilengkapi dengan tombol hapus foto kanda
                    imageColumnHtml = `
                        <div class="wrapper-foto">
                            <img src="${item.imageUrl}" class="img-preview" onclick="window.open('${item.imageUrl}', '_blank')">
                            <button class="btn-hapus-foto" data-index="${item.originalIndex}">❌ Hapus</button>
                        </div>
                    `;
                } else {
                    imageColumnHtml = `
                        <label class="upload-label" for="file_${item.originalIndex}">📷 Kamera</label>
                        <input type="file" id="file_${item.originalIndex}" class="file-input" data-index="${item.originalIndex}" accept="image/*" capture="environment" style="display:none;">
                    `;
                }

                tr.innerHTML = `
                    <td>${item.partNo}</td>
                    <td style="text-align:center;" id="img_container_${item.originalIndex}">${imageColumnHtml}</td>
                    <td>${item.deskripsi}</td>
                    <td><span class="badge">${item.group}</span></td>
                    <td>${item.type}</td>
                    <td>${item.unit}</td>
                    <td class="stok-sistem">${item.sistem}</td>
                    <td><input type="number" class="input-fisik" value="${fisikVal}" placeholder="0" data-row="${index}"></td>
                    <td class="kolom-selisih ${diffClass}">${diffText}</td>
                    <td><input type="text" class="input-remarks" value="${remarksVal}" placeholder="Tambah catatan..." data-row="${index}"></td>
                    <td><a class="btn-link" href="${staticUrl}" target="_blank">Google</a></td>
                `;
                fragment.appendChild(tr);
            });
            
            tbody.innerHTML = "";
            tbody.appendChild(fragment);
            updatePaginationControls();
        }

        // =========================================================================
        // 1. PROSES UPLOAD FOTO KE CLOUDINARY
        // =========================================================================
        tableBody.addEventListener('change', function(e) {
            if (e.target.classList.contains('file-input')) {
                const originalIndex = e.target.getAttribute('data-index');
                const file = e.target.files[0];
                if (!file) return;

                if (CLOUDINARY_CLOUD_NAME === "Ubah_Nama_Cloud_Cloudinary_Anda") {
                    alert("Kanda belum mengatur akun Cloudinary di dalam kode script!");
                    return;
                }

                const container = document.getElementById(`img_container_${originalIndex}`);
                container.innerHTML = `<span style="font-size:11px; color:var(--primary); font-weight:600;">⚡ Uploading...</span>`;

                const formData = new FormData();
                formData.append("file", file);
                formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);
                // Agar public_id file rapi (contoh: opname_M3050099)
                const customPublicId = `opname_${inventoryData[originalIndex].partNo}`;
                formData.append("public_id", customPublicId);

                fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
                    method: "POST",
                    body: formData
                })
                .then(res => { if (!res.ok) throw new Error(); return res.json(); })
                .then(data => {
                    const secureUrl = data.secure_url;
                    inventoryData[originalIndex].imageUrl = secureUrl;
                    
                    update(ref(db, `inventory_root/items/${originalIndex}`), { imageUrl: secureUrl })
                        .then(() => {
                            container.innerHTML = `
                                <div class="wrapper-foto">
                                    <img src="${secureUrl}" class="img-preview" onclick="window.open('${secureUrl}', '_blank')">
                                    <button class="btn-hapus-foto" data-index="${originalIndex}">❌ Hapus</button>
                                </div>
                            `;
                        });
                })
                .catch(() => {
                    alert("Gagal mengunggah foto!");
                    renderTablePage();
                });
            }
        });

        // =========================================================================
        // 2. PROSES HAPUS FOTO DARI CLOUDINARY & FIREBASE
        // =========================================================================
        tableBody.addEventListener('click', function(e) {
            if (e.target.classList.contains('btn-hapus-foto')) {
                const originalIndex = e.target.getAttribute('data-index');
                const item = inventoryData[originalIndex];

                if (!confirm(`Hapus foto untuk produk "${item.deskripsi}"?`)) return;

                const container = document.getElementById(`img_container_${originalIndex}`);
                container.innerHTML = `<span style="font-size:11px; color:var(--danger); font-weight:600;">🗑️ Menghapus...</span>`;

                // Ekstrak Public ID Cloudinary (misal dari URL didapat: opname_M3050099)
                const publicId = `opname_${item.partNo}`;
                const timestamp = Math.round(new Date().getTime() / 1000);
                
                // Membuat tanda tangan keamanan SHA-1 untuk otorisasi penghapusan file kanda
                const signatureString = `public_id=${publicId}&timestamp=${timestamp}${CLOUDINARY_API_SECRET}`;
                const signature = CryptoJS.SHA1(signatureString).toString();

                const formData = new FormData();
                formData.append("public_id", publicId);
                formData.append("timestamp", timestamp);
                formData.append("api_key", CLOUDINARY_API_KEY);
                formData.append("signature", signature);

                // Tembak API Destroy Cloudinary
                fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/destroy`, {
                    method: "POST",
                    body: formData
                })
                .then(res => res.json())
                .then(data => {
                    if (data.result === "ok" || data.result === "not_found") {
                        // Hapus tautan di database lokal & Firebase
                        inventoryData[originalIndex].imageUrl = "";
                        update(ref(db, `inventory_root/items/${originalIndex}`), { imageUrl: "" })
                            .then(() => {
                                container.innerHTML = `
                                    <label class="upload-label" for="file_${originalIndex}">📷 Kamera</label>
                                    <input type="file" id="file_${originalIndex}" class="file-input" data-index="${originalIndex}" accept="image/*" capture="environment" style="display:none;">
                                `;
                            });
                    } else {
                        throw new Error();
                    }
                })
                .catch(() => {
                    alert("Gagal menghapus gambar di Cloudinary! Periksa API Key / Secret Anda.");
                    renderTablePage();
                });
            }
        });

        // Sisa fungsi bawaan aplikasi stock opname kanda tetap dipertahankan utuh...
        function refreshActiveDataOnly() {
            const rows = tableBody.querySelectorAll('tr');
            rows.forEach(row => {
                const origIdx = row.getAttribute('data-original-index');
                if (origIdx !== null) {
                    const cloudItem = inventoryData[origIdx];
                    if (cloudItem) {
                        const targetFiltered = filteredData.find(f => f.originalIndex == origIdx);
                        if (targetFiltered) {
                            targetFiltered.fisik = cloudItem.fisik;
                            targetFiltered.remarks = cloudItem.remarks;
                            targetFiltered.imageUrl = cloudItem.imageUrl;
                        }
                    }
                }
            });
        }

        function updatePaginationControls() {
            const maxPage = Math.ceil(filteredData.length / rowsPerPage) || 1;
            const start = (currentPage - 1) * rowsPerPage;
            const end = start + rowsPerPage;
            const totalShow = Math.min(end, filteredData.length);
            document.getElementById('pageInfo').innerText = `Menampilkan ${filteredData.length > 0 ? start + 1 : 0}-${totalShow} dari ${filteredData.length} item`;
            document.getElementById('btnPrev').disabled = (currentPage === 1);
            document.getElementById('btnNext').disabled = (currentPage === maxPage || filteredData.length === 0);
        }

        tableBody.addEventListener('input', function(e) {
            const row = e.target.closest('tr');
            const originalIndex = row.getAttribute('data-original-index');
            if (e.target.classList.contains('input-fisik')) {
                const value = e.target.value; const fisikValue = value !== "" ? parseFloat(value) : "";
                inventoryData[originalIndex].fisik = fisikValue;
                clearTimeout(firebaseTimeouts[originalIndex + '_fisik']);
                firebaseTimeouts[originalIndex + '_fisik'] = setTimeout(() => { update(ref(db, `inventory_root/items/${originalIndex}`), { fisik: fisikValue }); }, 500); 
            }
            if (e.target.classList.contains('input-remarks')) {
                const remarksValue = e.target.value; inventoryData[originalIndex].remarks = remarksValue;
                clearTimeout(firebaseTimeouts[originalIndex + '_remarks']);
                firebaseTimeouts[originalIndex + '_remarks'] = setTimeout(() => { update(ref(db, `inventory_root/items/${originalIndex}`), { remarks: remarksValue }); }, 500);
            }
        });

        function applySearchAndRender() {
            const filter = document.getElementById('searchInput').value.toLowerCase();
            filteredData = inventoryData
                .map((item, index) => ({ ...item, originalIndex: index }))
                .filter(item => item.partNo.toLowerCase().includes(filter) || item.deskripsi.toLowerCase().includes(filter));
            currentPage = 1; renderTablePage();
        }

        let searchTimeout;
        document.getElementById('searchInput').addEventListener('input', () => { clearTimeout(searchTimeout); searchTimeout = setTimeout(applySearchAndRender, 150); });
        document.getElementById('btnPrev').addEventListener('click', () => { if (currentPage > 1) { currentPage--; renderTablePage(); window.scrollTo(0,0); } });
        document.getElementById('btnNext').addEventListener('click', () => { const maxPage = Math.ceil(filteredData.length / rowsPerPage); if (currentPage < maxPage) { currentPage++; renderTablePage(); window.scrollTo(0,0); } });
        
        // Modal & Paste Logika manual dsb...
        const modal = document.getElementById("addModal");
        document.getElementById("btnOpenModal").addEventListener("click", () => { modal.style.display = "flex"; document.getElementById("formPartNo").focus(); });
        document.getElementById("btnCloseModal").addEventListener("click", () => { modal.style.display = "none"; });
        document.getElementById("btnSaveModal").addEventListener("click", () => {
            const partNo = document.getElementById("formPartNo").value.trim();
            const deskripsi = document.getElementById("formDeskripsi").value.trim();
            if(!partNo || !deskripsi) return alert("Wajib diisi!");
            inventoryData.push({ partNo, deskripsi, group:"-", type:"-", unit:"-", sistem:0, fisik:"", remarks:"", imageUrl:"" });
            set(ref(db, 'inventory_root'), { items: inventoryData, lastUpdate: new Date().toLocaleString() }).then(() => { modal.style.display="none"; applySearchAndRender(); });
        });
    </script>
</body>
</html>
