<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Stock Opname - Rinra</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #10b981;
            --success-hover: #059669;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --background: #f8fafc;
            --surface: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            background: var(--surface);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        header {
            margin-bottom: 24px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 16px;
        }

        h1 {
            font-size: 24px;
            color: #0f172a;
            margin-bottom: 4px;
        }

        .update-info {
            font-size: 13px;
            color: var(--text-muted);
        }

        /* Toolbar / Control Panel */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
            align-items: center;
            justify-content: space-between;
        }

        .search-box {
            flex: 1;
            min-width: 280px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 243, 0.1);
        }

        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        button, .btn-link {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background-color 0.2s, transform 0.1s;
            text-decoration: none;
        }

        button:active { transform: scale(0.98); }

        .btn-primary { background-color: var(--primary); color: white; }
        .btn-primary:hover { background-color: var(--primary-hover); }

        .btn-success { background-color: var(--success); color: white; }
        .btn-success:hover { background-color: var(--success-hover); }

        .btn-danger { background-color: var(--danger); color: white; }
        .btn-danger:hover { background-color: var(--danger-hover); }

        /* Tabel Data */
        .table-container {
            overflow-x: auto;
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }

        th {
            background-color: #f1f5f9;
            color: #475569;
            font-weight: 600;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }

        tr:last-child td { border-bottom: none; }
        tr:hover { background-color: #f8fafc; }

        /* Row Active saat Fokus Input */
        .row-active {
            background-color: #eff6ff !important;
        }

        .badge {
            background-color: #e2e8f0;
            color: #334155;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }

        .stok-sistem {
            font-weight: 600;
            color: #334155;
            text-align: center;
        }

        .input-fisik {
            width: 80px;
            padding: 6px 10px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            outline: none;
        }

        .input-fisik:focus {
            border-color: var(--primary);
            background-color: #ffffff;
        }

        /* Style Kolom Selisih */
        .kolom-selisih {
            font-weight: 600;
            text-align: center;
            font-size: 14px;
        }
        .diff-zero { color: var(--text-muted); }
        .diff-plus { color: #059669; background-color: #ecfdf5; border-radius: 4px; padding: 2px 6px; }
        .diff-minus { color: #dc2626; background-color: #fef2f2; border-radius: 4px; padding: 2px 6px; }

        .btn-link {
            padding: 4px 8px;
            font-size: 12px;
            background-color: #f1f5f9;
            color: var(--primary);
            border: 1px solid var(--border);
        }
        .btn-link:hover { background-color: #e2e8f0; }

        /* Pagination Controls */
        .pagination {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        .page-info {
            font-size: 14px;
            color: var(--text-muted);
        }

        .page-buttons {
            display: flex;
            gap: 8px;
        }

        .btn-page {
            padding: 6px 12px;
            background-color: #ffffff;
            border: 1px solid var(--border);
            color: var(--text-main);
        }
        .btn-page:hover:not(:disabled) { background-color: #f1f5f9; }
        .btn-page:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Sistem Stock Opname Rinra</h1>
            <div class="update-info" id="updateDate">Memuat data dari cloud...</div>
        </header>

        <div class="toolbar">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Cari berdasarkan Part No, Deskripsi, atau Group...">
            </div>
            <div class="button-group">
                <button class="btn-primary" id="btnPaste">📥 Paste Data Excel</button>
                <button class="btn-success" id="btnCopy">📋 Salin Hasil Opname</button>
                <button class="btn-danger" id="btnReset">🗑️ Kosongkan Cloud</button>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Part No.</th>
                        <th>Deskripsi Barang</th>
                        <th>Group Name</th>
                        <th>Item Type</th>
                        <th>Unit</th>
                        <th style="text-align: center;">Stok Sistem</th>
                        <th style="text-align: center;">Fisik</th>
                        <th style="text-align: center;">Selisih</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="9" style="text-align:center; padding:30px; color:#94a3b8;">Menghubungkan ke server cloud...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="pagination">
            <div class="page-info" id="pageInfo">Menampilkan 0-0 dari 0 item</div>
            <div class="page-buttons">
                <button class="btn-page" id="btnPrev" disabled>◀ Sebelumnya</button>
                <button class="btn-page" id="btnNext" disabled>Berikutnya ▶</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // Konfigurasi Database Firebase Aplikasi Anda
        const firebaseConfig = {
            apiKey: "AIzaSyBCmlVCm69mAJP0m8DoojN1uus9XMuwgEk",
            authDomain: "opname-rinra.firebaseapp.com",
            databaseURL: "https://opname-rinra-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "opname-rinra",
            storageBucket: "opname-rinra.firebasestorage.app",
            messagingSenderId: "454143552303",
            appId: "1:454143552303:web:7055d7625c9aaaebf50fda",
            measurementId: "G-GFFZJLLWMW"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        let inventoryData = [];
        let filteredData = [];
        let firebaseTimeouts = {}; 
        
        let currentPage = 1;
        const rowsPerPage = 50; 

        // 1. Sinkronisasi Data Realtime dari Cloud Firebase
        const dbRef = ref(db, 'inventory_root');
        onValue(dbRef, (snapshot) => {
            const dataRaw = snapshot.val();
            if (dataRaw && dataRaw.items) {
                inventoryData = dataRaw.items;
                applySearchAndRender(); 
                if (dataRaw.lastUpdate) {
                    document.getElementById('updateDate').innerText = `Terakhir diperbarui: ${dataRaw.lastUpdate}`;
                }
            } else {
                inventoryData = []; filteredData = [];
                document.getElementById('tableBody').innerHTML = `<tr><td colspan="9" style="text-align:center; padding:30px; color:#94a3b8;">Cloud kosong. Silakan paste data teks inventaris Anda.</td></tr>`;
                document.getElementById('updateDate').innerText = "Terakhir diperbarui: Belum ada data di cloud";
                updatePaginationControls();
            }
        });

        // 2. Fungsi Rendering Tabel (Ringan dengan DOM Fragment)
        function renderTablePage() {
            const tbody = document.getElementById('tableBody');
            if (filteredData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9" style="text-align:center; padding:20px; color:#94a3b8;">Data tidak ditemukan</td></tr>`;
                document.getElementById('pageInfo').innerText = "Menampilkan 0 dari 0 item";
                return;
            }

            const start = (currentPage - 1) * rowsPerPage;
            const end = start + rowsPerPage;
            const pageItems = filteredData.slice(start, end);

            const fragment = document.createDocumentFragment();

            pageItems.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.setAttribute('data-original-index', item.originalIndex);
                tr.setAttribute('data-page-row-index', index);

                let diffClass = "diff-zero"; let diffText = "0";
                if (item.fisik !== undefined && item.fisik !== null && item.fisik !== "") {
                    const selisih = item.fisik - item.sistem;
                    if (selisih < 0) { diffClass = "diff-minus"; diffText = selisih; }
                    else if (selisih > 0) { diffClass = "diff-plus"; diffText = "+" + selisih; }
                }

                const staticUrl = `https://www.google.com/search?tbm=isch&q=${encodeURIComponent(item.deskripsi)}`;
                const fisikVal = (item.fisik !== undefined && item.fisik !== null) ? item.fisik : "";

                tr.innerHTML = `
                    <td>${item.partNo}</td>
                    <td>${item.deskripsi}</td>
                    <td><span class="badge">${item.group}</span></td>
                    <td>${item.type}</td>
                    <td>${item.unit}</td>
                    <td class="stok-sistem">${item.sistem}</td>
                    <td><input type="number" class="input-fisik" value="${fisikVal}" placeholder="0" data-row="${index}"></td>
                    <td class="kolom-selisih ${diffClass}">${diffText}</td>
                    <td><a class="btn-link" href="${staticUrl}" target="_blank">Lihat Gambar</a></td>
                `;
                fragment.appendChild(tr);
            });
            
            tbody.innerHTML = "";
            tbody.appendChild(fragment);
            
            const totalShow = Math.min(end, filteredData.length);
            document.getElementById('pageInfo').innerText = `Menampilkan ${start + 1}-${totalShow} dari ${filteredData.length} item`;
            updatePaginationControls();
        }

        function updatePaginationControls() {
            const maxPage = Math.ceil(filteredData.length / rowsPerPage) || 1;
            document.getElementById('btnPrev').disabled = (currentPage === 1);
            document.getElementById('btnNext').disabled = (currentPage === maxPage || filteredData.length === 0);
        }

        // 3. Logika Input Fisik & Navigasi Panah Keyboard (Up / Down / Enter)
        const tableBody = document.getElementById('tableBody');

        tableBody.addEventListener('focusin', function(e) {
            if (e.target.classList.contains('input-fisik')) {
                e.target.closest('tr').classList.add('row-active');
            }
        });
        tableBody.addEventListener('focusout', function(e) {
            if (e.target.classList.contains('input-fisik')) {
                e.target.closest('tr').classList.remove('row-active');
            }
        });

        tableBody.addEventListener('keydown', function(e) {
            if (e.target.classList.contains('input-fisik')) {
                const currentRowIndex = parseInt(e.target.getAttribute('data-row'));
                if (e.key === 'Enter' || e.key === 'ArrowDown') {
                    e.preventDefault();
                    const nextInput = tableBody.querySelector(`.input-fisik[data-row="${currentRowIndex + 1}"]`);
                    if (nextInput) nextInput.focus();
                } 
                else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    const prevInput = tableBody.querySelector(`.input-fisik[data-row="${currentRowIndex - 1}"]`);
                    if (prevInput) prevInput.focus();
                }
            }
        });

        // Simpan otomatis ke Firebase (Debounce 500ms agar ketikan lancar tanpa lag internet)
        tableBody.addEventListener('input', function(e) {
            if (e.target.classList.contains('input-fisik')) {
                const row = e.target.closest('tr');
                const originalIndex = row.getAttribute('data-original-index');
                const value = e.target.value;
                const fisikValue = value !== "" ? parseFloat(value) : "";
                
                const targetItem = inventoryData[originalIndex];
                targetItem.fisik = fisikValue;

                const kolomSelisih = row.querySelector('.kolom-selisih');
                if (value === "") {
                    kolomSelisih.innerText = "0"; kolomSelisih.className = "kolom-selisih diff-zero";
                } else {
                    const selisih = fisikValue - targetItem.sistem;
                    if (selisih === 0) { kolomSelisih.innerText = "0"; kolomSelisih.className = "kolom-selisih diff-zero"; }
                    else if (selisih < 0) { kolomSelisih.innerText = selisih; kolomSelisih.className = "kolom-selisih diff-minus"; }
                    else { kolomSelisih.innerText = "+" + selisih; kolomSelisih.className = "kolom-selisih diff-plus"; }
                }

                clearTimeout(firebaseTimeouts[originalIndex]);
                firebaseTimeouts[originalIndex] = setTimeout(() => {
                    update(ref(db, `inventory_root/items/${originalIndex}`), { fisik: fisikValue });
                }, 500); 
            }
        });

        // 4. Sistem Pencarian Realtime
        function applySearchAndRender() {
            const filter = document.getElementById('searchInput').value.toLowerCase();
            filteredData = inventoryData
                .map((item, index) => ({ ...item, originalIndex: index }))
                .filter(item => {
                    return item.partNo.toLowerCase().includes(filter) || 
                           item.deskripsi.toLowerCase().includes(filter) || 
                           item.group.toLowerCase().includes(filter);
                });
            currentPage = 1;
            renderTablePage();
        }

        let searchTimeout;
        document.getElementById('searchInput').addEventListener('input', function() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(applySearchAndRender, 150);
        });

        document.getElementById('btnPrev').addEventListener('click', () => { if (currentPage > 1) { currentPage--; renderTablePage(); window.scrollTo(0,0); } });
        document.getElementById('btnNext').addEventListener('click', () => { const maxPage = Math.ceil(filteredData.length / rowsPerPage); if (currentPage < maxPage) { currentPage++; renderTablePage(); window.scrollTo(0,0); } });

        // 5. Fungsi Pemisah Teks Pintar (Mendukung Tab Excel maupun Spasi Ganda)
        function splitIntoColumns(rowText) {
            let parts = [];
            if (rowText.includes('\t')) {
                parts = rowText.split('\t');
            } else {
                parts = rowText.split(/\s{2,}/);
            }
            return parts.map(p => p.trim()).filter(p => p !== "");
        }

        // 6. Tombol Fungsi Paste Data Baru (Menyisir kolom paling kanan secara dinamis)
        document.getElementById('btnPaste').addEventListener('click', async function() {
            try {
                const text = await navigator.clipboard.readText();
                if (!text.trim()) { alert("Clipboard kosong! Salin tabel data di Excel terlebih dahulu."); return; }

                const barisData = text.split("\n");
                let arrayBaru = [];

                barisData.forEach(baris => {
                    const cleanBaris = baris.trim();
                    if (!cleanBaris) return;
                    
                    const kolom = splitIntoColumns(cleanBaris);
                    
                    if (kolom.length >= 2) {
                        // Lewati baris jika terdeteksi merupakan judul kolom/header tabel
                        if (kolom[0].toLowerCase().includes("part no") || kolom[1].toLowerCase().includes("desc")) return;

                        // MENYIKYAL ANGKA STOK: Mengambil elemen indeks paling terakhir di baris teks (Mengunci kolom On Hand)
                        const nilaiStokMentah = kolom[kolom.length - 1]; 
                        const cleanStokSistem = parseFloat(nilaiStokMentah.replace(/,/g, '')) || 0;

                        arrayBaru.push({
                            partNo: kolom[0] ? kolom[0] : "-",
                            deskripsi: kolom[1] ? kolom[1] : "-",
                            group: kolom[2] ? kolom[2] : "-",
                            type: kolom[3] ? kolom[3] : "-",
                            unit: kolom[4] ? kolom[4] : "-",
                            sistem: cleanStokSistem, // Nilai On Hand murni tanpa koma pemisah ribuan
                            fisik: ""
                        });
                    }
                });

                if (arrayBaru.length > 0) {
                    const opsiTanggal = { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute:'2-digit' };
                    const waktuSkrg = new Date().toLocaleDateString('id-ID', opsiTanggal) + " WITA";
                    
                    set(ref(db, 'inventory_root'), { items: arrayBaru, lastUpdate: waktuSkrg })
                        .then(() => alert(`Berhasil mengunggah ${arrayBaru.length} data inventaris baru ke Cloud!`));
                } else {
                    alert("Gagal membaca struktur teks. Pastikan data yang Anda salin minimal memuat kolom Part No dan On Hand.");
                }
            } catch (err) { alert("Izin akses Clipboard ditolak oleh browser Anda."); }
        });

        // 7. Tombol Salin Hasil Opname Kembali ke Excel
        document.getElementById('btnCopy').addEventListener('click', function() {
            if (inventoryData.length === 0) { alert("Tidak ada data untuk disalin."); return; }
            let tsvContent = "Part No.\tDeskripsi\tGroup Name\tItem Type\tUnit\tStok Sistem\tFisik\tSelisih\n";
            inventoryData.forEach(item => {
                const fisikVal = (item.fisik !== undefined && item.fisik !== null && item.fisik !== "") ? item.fisik : "0";
                let selisihVal = "0";
                if (item.fisik !== undefined && item.fisik !== null && item.fisik !== "") {
                    const calc = item.fisik - item.sistem;
                    selisihVal = calc > 0 ? "+" + calc : calc;
                }
                tsvContent += `${item.partNo}\t${item.deskripsi}\t${item.group}\t${item.type}\t${item.unit}\t${item.sistem}\t${fisikVal}\t${selisihVal}\n`;
            });
            navigator.clipboard.writeText(tsvContent).then(() => {
                const btn = document.getElementById('btnCopy'); btn.innerText = "✅ Hasil Opname Disalin!"; btn.style.backgroundColor = "#059669";
                setTimeout(() => { btn.innerText = "📋 Salin Hasil Opname"; btn.style.backgroundColor = "#10b981"; }, 2000);
            });
        });

        // 8. Tombol Kosongkan Seluruh Basis Data
        document.getElementById('btnReset').addEventListener('click', function() {
            if (confirm("Apakah Anda yakin ingin menghapus seluruh data inventaris yang ada di cloud?")) {
                set(ref(db, 'inventory_root'), null);
            }
        });
    </script>
</body>
</html>
