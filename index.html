<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Stock Opname - Rinra</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #10b981;
            --success-hover: #059669;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --background: #f8fafc;
            --surface: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--background); color: var(--text-main); padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 1400px; background: var(--surface); padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        header { margin-bottom: 24px; border-bottom: 2px solid var(--border); padding-bottom: 16px; }
        h1 { font-size: 24px; color: #0f172a; margin-bottom: 4px; }
        .update-info { font-size: 13px; color: var(--text-muted); }
        .toolbar { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; align-items: center; justify-content: space-between; }
        .search-box { flex: 1; min-width: 280px; }
        .search-box input { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; outline: none; }
        .search-box input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 243, 0.1); }
        .button-group { display: flex; flex-wrap: wrap; gap: 8px; }
        button, .btn-link { padding: 10px 16px; border: none; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s; text-decoration: none; }
        button:active { transform: scale(0.98); }
        .btn-primary { background-color: var(--primary); color: white; }
        .btn-primary:hover { background-color: var(--primary-hover); }
        .btn-success { background-color: var(--success); color: white; }
        .btn-success:hover { background-color: var(--success-hover); }
        .btn-danger { background-color: var(--danger); color: white; }
        .btn-danger:hover { background-color: var(--danger-hover); }
        .btn-amber { background-color: #f59e0b; color: white; }
        .btn-amber:hover { background-color: #d97706; }
        
        .table-container { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
        th { background-color: #f1f5f9; color: #475569; font-weight: 600; padding: 12px 16px; border-bottom: 1px solid var(--border); white-space: nowrap; }
        td { padding: 12px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
        tr:hover { background-color: #f8fafc; }
        .row-active { background-color: #eff6ff !important; }
        .badge { background-color: #e2e8f0; color: #334155; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 500; }
        .stok-sistem { font-weight: 600; color: #334155; text-align: center; }
        
        .input-fisik { width: 80px; padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 14px; font-weight: 600; text-align: center; outline: none; }
        .input-remarks { width: 180px; padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 13px; outline: none; }
        .input-fisik:focus, .input-remarks:focus { border-color: var(--primary); background-color: #ffffff; }

        .kolom-selisih { font-weight: 600; text-align: center; font-size: 14px; }
        .diff-zero { color: var(--text-muted); }
        .diff-plus { color: #059669; background-color: #ecfdf5; border-radius: 4px; padding: 2px 6px; }
        .diff-minus { color: #dc2626; background-color: #fef2f2; border-radius: 4px; padding: 2px 6px; }
        
        .img-preview {
            width: 45px; height: 45px; border-radius: 6px; object-fit: cover;
            border: 1px solid var(--border); cursor: pointer; transition: transform 0.2s;
        }
        .img-preview:hover { transform: scale(1.1); }
        
        .upload-label {
            padding: 5px 10px; background-color: #f1f5f9; border: 1px solid var(--border);
            border-radius: 6px; font-size: 12px; cursor: pointer; color: var(--text-main); font-weight: 500;
            display: inline-flex; align-items: center; gap: 4px;
        }
        .upload-label:hover { background-color: #e2e8f0; }

        .btn-link { padding: 4px 8px; font-size: 12px; background-color: #f1f5f9; color: var(--primary); border: 1px solid var(--border); }
        .pagination { display: flex; align-items: center; justify-content: space-between; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
        .page-info { font-size: 14px; color: var(--text-muted); }
        .page-buttons { display: flex; gap: 8px; }
        .btn-page { padding: 6px 12px; background-color: #ffffff; border: 1px solid var(--border); color: var(--text-main); }
        .btn-page:disabled { opacity: 0.5; cursor: not-allowed; }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.4); justify-content: center; align-items: center; z-index: 9999;
        }
        .modal-content {
            background: white; padding: 24px; border-radius: 12px; width: 100%; max-width: 450px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
        }
        .modal-content h3 { margin-bottom: 16px; font-size: 18px; color: #0f172a; }
        .form-group { margin-bottom: 12px; display: flex; flex-direction: column; gap: 4px; }
        .form-group label { font-size: 13px; font-weight: 600; color: #475569; }
        .form-group input { padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; outline: none; }
        .modal-buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Sistem Stock Opname Rinra</h1>
            <div class="update-info" id="updateDate">Menghubungkan ke cloud...</div>
        </header>

        <div class="toolbar">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Cari berdasarkan Part No atau Deskripsi Barang...">
            </div>
            <div class="button-group">
                <button class="btn-amber" id="btnOpenModal">➕ Tambah Data Manual</button>
                <button class="btn-primary" id="btnPaste">📥 Paste Data Excel</button>
                <button class="btn-success" id="btnCopy">📋 Salin Hasil Opname</button>
                <button class="btn-danger" id="btnReset">🗑️ Kosongkan Cloud</button>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Part No.</th>
                        <th style="text-align: center;">Foto Item</th>
                        <th>Deskripsi Barang</th>
                        <th>Group Name</th>
                        <th>Item Type</th>
                        <th>Unit</th>
                        <th style="text-align: center;">Stok Sistem</th>
                        <th style="text-align: center;">Fisik</th>
                        <th style="text-align: center;">Selisih</th>
                        <th>Remarks / Keterangan</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="11" style="text-align:center; padding:30px; color:#94a3b8;">Menghubungkan ke server cloud...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="pagination">
            <div class="page-info" id="pageInfo">Menampilkan 0-0 dari 0 item</div>
            <div class="page-buttons">
                <button class="btn-page" id="btnPrev" disabled>◀ Sebelumnya</button>
                <button class="btn-page" id="btnNext" disabled>Berikutnya ▶</button>
            </div>
        </div>
    </div>

    <div class="modal" id="addModal">
        <div class="modal-content">
            <h3>Tambah Item Inventaris Baru</h3>
            <div class="form-group"><label>Part No.</label><input type="text" id="formPartNo" placeholder="Contoh: M3050099"></div>
            <div class="form-group"><label>Deskripsi Barang</label><input type="text" id="formDeskripsi" placeholder="Contoh: Kertas HVS A4"></div>
            <div class="form-group"><label>Group Name</label><input type="text" id="formGroup" placeholder="Contoh: Printing & Stationary"></div>
            <div class="form-group"><label>Item Type</label><input type="text" id="formType" value="Material"></div>
            <div class="form-group"><label>Unit</label><input type="text" id="formUnit" placeholder="Contoh: Pcs / Pack / Rim"></div>
            <div class="form-group"><label>Stok Sistem (On Hand)</label><input type="number" id="formSistem" value="0"></div>
            <div class="modal-buttons">
                <button class="btn btn-danger" style="padding:8px 14px;" id="btnCloseModal">Batal</button>
                <button class="btn btn-success" style="padding:8px 14px;" id="btnSaveModal">Simpan</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBCmlVCm69mAJP0m8DoojN1uus9XMuwgEk",
            authDomain: "opname-rinra.firebaseapp.com",
            databaseURL: "https://opname-rinra-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "opname-rinra",
            storageBucket: "opname-rinra.firebasestorage.app",
            messagingSenderId: "454143552303",
            appId: "1:454143552303:web:7055d7625c9aaaebf50fda",
            measurementId: "G-GFFZJLLWMW"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const storage = getStorage(app);
        
        let inventoryData = [];
        let filteredData = [];
        let firebaseTimeouts = {}; 
        let currentPage = 1;
        const rowsPerPage = 50; 
        let isInitialLoad = true; 

        // 1. Ambil Data Realtime dari Cloud Firebase
        const dbRef = ref(db, 'inventory_root');
        onValue(dbRef, (snapshot) => {
            const dataRaw = snapshot.val();
            if (dataRaw && dataRaw.items) {
                inventoryData = dataRaw.items;
                
                if (isInitialLoad) {
                    applySearchAndRender();
                    isInitialLoad = false;
                } else {
                    refreshActiveDataOnly();
                }

                if (dataRaw.lastUpdate) {
                    document.getElementById('updateDate').innerText = `Terakhir diperbarui: ${dataRaw.lastUpdate}`;
                }
            } else {
                inventoryData = []; filteredData = [];
                document.getElementById('tableBody').innerHTML = `<tr><td colspan="11" style="text-align:center; padding:30px; color:#94a3b8;">Cloud kosong. Silakan paste data teks inventaris Anda.</td></tr>`;
                document.getElementById('updateDate').innerText = "Terakhir diperbarui: Belum ada data di cloud";
                updatePaginationControls();
            }
        }, (error) => {
            document.getElementById('updateDate').innerText = "Error: Cek konfigurasi cloud!";
            console.error(error);
        });

        // 2. Render Tabel Dinamis (Kolom Shortcut Dihapus, Kamera Aktif)
        function renderTablePage(shouldFocusFirstRow = false) {
            const tbody = document.getElementById('tableBody');
            if (filteredData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="11" style="text-align:center; padding:20px; color:#94a3b8;">Data tidak ditemukan</td></tr>`;
                document.getElementById('pageInfo').innerText = "Menampilkan 0 dari 0 item";
                return;
            }

            const start = (currentPage - 1) * rowsPerPage;
            const end = start + rowsPerPage;
            const pageItems = filteredData.slice(start, end);
            const fragment = document.createDocumentFragment();

            pageItems.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.setAttribute('data-original-index', item.originalIndex);
                tr.setAttribute('data-page-row-index', index);

                let diffClass = "diff-zero"; let diffText = "0";
                if (item.fisik !== undefined && item.fisik !== null && item.fisik !== "") {
                    const selisih = item.fisik - item.sistem;
                    if (selisih < 0) { diffClass = "diff-minus"; diffText = selisih; }
                    else if (selisih > 0) { diffClass = "diff-plus"; diffText = "+" + selisih; }
                }

                const staticUrl = `https://www.google.com/search?tbm=isch&q=${encodeURIComponent(item.deskripsi)}`;
                const fisikVal = (item.fisik !== undefined && item.fisik !== null) ? item.fisik : "";
                const remarksVal = item.remarks ? item.remarks : "";

                // MODIFIKASI: Input file dikunci menggunakan capture="environment" untuk langsung mentembak kamera HP
                let imageColumnHtml = "";
                if (item.imageUrl) {
                    imageColumnHtml = `<img src="${item.imageUrl}" class="img-preview" onclick="window.open('${item.imageUrl}', '_blank')">`;
                } else {
                    imageColumnHtml = `
                        <label class="upload-label" for="file_${item.originalIndex}">📷 Kamera</label>
                        <input type="file" id="file_${item.originalIndex}" class="file-input" data-index="${item.originalIndex}" accept="image/*" capture="environment" style="display:none;">
                    `;
                }

                tr.innerHTML = `
                    <td>${item.partNo}</td>
                    <td style="text-align:center;" id="img_container_${item.originalIndex}">${imageColumnHtml}</td>
                    <td>${item.deskripsi}</td>
                    <td><span class="badge">${item.group}</span></td>
                    <td>${item.type}</td>
                    <td>${item.unit}</td>
                    <td class="stok-sistem">${item.sistem}</td>
                    <td><input type="number" class="input-fisik" value="${fisikVal}" placeholder="0" data-row="${index}"></td>
                    <td class="kolom-selisih ${diffClass}">${diffText}</td>
                    <td><input type="text" class="input-remarks" value="${remarksVal}" placeholder="Tambah catatan..." data-row="${index}"></td>
                    <td><a class="btn-link" href="${staticUrl}" target="_blank">Google</a></td>
                `;
                fragment.appendChild(tr);
            });
            
            tbody.innerHTML = "";
            tbody.appendChild(fragment);
            updatePaginationControls();

            if (shouldFocusFirstRow) {
                setTimeout(() => {
                    const firstInput = tbody.querySelector('.input-fisik[data-row="0"]');
                    if (firstInput) firstInput.focus();
                }, 50);
            }
        }

        function refreshActiveDataOnly() {
            const rows = tableBody.querySelectorAll('tr');
            rows.forEach(row => {
                const origIdx = row.getAttribute('data-original-index');
                if (origIdx !== null) {
                    const cloudItem = inventoryData[origIdx];
                    if (cloudItem) {
                        const targetFiltered = filteredData.find(f => f.originalIndex == origIdx);
                        if (targetFiltered) {
                            targetFiltered.fisik = cloudItem.fisik;
                            targetFiltered.remarks = cloudItem.remarks;
                            targetFiltered.imageUrl = cloudItem.imageUrl;
                        }
                    }
                }
            });
        }

        function updatePaginationControls() {
            const maxPage = Math.ceil(filteredData.length / rowsPerPage) || 1;
            const start = (currentPage - 1) * rowsPerPage;
            const end = start + rowsPerPage;
            const totalShow = Math.min(end, filteredData.length);
            document.getElementById('pageInfo').innerText = `Menampilkan ${filteredData.length > 0 ? start + 1 : 0}-${totalShow} dari ${filteredData.length} item`;
            document.getElementById('btnPrev').disabled = (currentPage === 1);
            document.getElementById('btnNext').disabled = (currentPage === maxPage || filteredData.length === 0);
        }

        const tableBody = document.getElementById('tableBody');
        tableBody.addEventListener('focusin', (e) => { if (e.target.classList.contains('input-fisik') || e.target.classList.contains('input-remarks')) e.target.closest('tr').classList.add('row-active'); });
        tableBody.addEventListener('focusout', (e) => { if (e.target.classList.contains('input-fisik') || e.target.classList.contains('input-remarks')) e.target.closest('tr').classList.remove('row-active'); });

        // 3. Menangani Tangkapan Kamera & Upload Langsung ke Firebase Storage
        tableBody.addEventListener('change', function(e) {
            if (e.target.classList.contains('file-input')) {
                const originalIndex = e.target.getAttribute('data-index');
                const file = e.target.files[0];
                if (!file) return;

                const container = document.getElementById(`img_container_${originalIndex}`);
                container.innerHTML = `<span style="font-size:11px; color:var(--primary); font-weight:600;">⚡ Uploading...</span>`;

                const fileExtension = file.name.split('.').pop() || 'jpg';
                const pathStorage = `item_images/${inventoryData[originalIndex].partNo}_${Date.now()}.${fileExtension}`;
                const storageRef = sRef(storage, pathStorage);

                uploadBytes(storageRef, file).then((snapshot) => {
                    getDownloadURL(snapshot.ref).then((downloadUrl) => {
                        inventoryData[originalIndex].imageUrl = downloadUrl;
                        
                        update(ref(db, `inventory_root/items/${originalIndex}`), { imageUrl: downloadUrl })
                            .then(() => {
                                container.innerHTML = `<img src="${downloadUrl}" class="img-preview" onclick="window.open('${downloadUrl}', '_blank')">`;
                            });
                    });
                }).catch(err => {
                    alert("Gagal mengunggah foto. Pastikan Rules Firebase Storage sudah dibuka!");
                    renderTablePage();
                });
            }
        });

        // 4. Navigasi Keyboard Tanpa Lompat Halaman
        tableBody.addEventListener('keydown', function(e) {
            if (e.target.classList.contains('input-fisik')) {
                const currentRowIndex = parseInt(e.target.getAttribute('data-row'));
                if (e.key === 'Enter' || e.key === 'ArrowDown') {
                    e.preventDefault();
                    const nextInput = tableBody.querySelector(`.input-fisik[data-row="${currentRowIndex + 1}"]`);
                    if (nextInput) {
                        nextInput.focus();
                    } else {
                        const maxPage = Math.ceil(filteredData.length / rowsPerPage);
                        if (currentPage < maxPage) {
                            currentPage++;
                            renderTablePage(true);
                            window.scrollTo(0, 0);
                        }
                    }
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    const prevInput = tableBody.querySelector(`.input-fisik[data-row="${currentRowIndex - 1}"]`);
                    if (prevInput) {
                        prevInput.focus();
                    } else if (currentPage > 1) {
                        currentPage--;
                        renderTablePage();
                        setTimeout(() => {
                            const lastInputInPrevPage = tableBody.querySelector(`.input-fisik[data-row="${rowsPerPage - 1}"]`);
                            if (lastInputInPrevPage) lastInputInPrevPage.focus();
                        }, 50);
                    }
                }
            }
        });

        tableBody.addEventListener('input', function(e) {
            const row = e.target.closest('tr');
            const originalIndex = row.getAttribute('data-original-index');

            if (e.target.classList.contains('input-fisik')) {
                const value = e.target.value;
                const fisikValue = value !== "" ? parseFloat(value) : "";
                inventoryData[originalIndex].fisik = fisikValue;
                const kolomSelisih = row.querySelector('.kolom-selisih');
                
                if (value === "") {
                    kolomSelisih.innerText = "0"; kolomSelisih.className = "kolom-selisih diff-zero";
                } else {
                    const selisih = fisikValue - inventoryData[originalIndex].sistem;
                    if (selisih === 0) { kolomSelisih.innerText = "0"; kolomSelisih.className = "kolom-selisih diff-zero"; }
                    else if (selisih < 0) { kolomSelisih.innerText = selisih; kolomSelisih.className = "kolom-selisih diff-minus"; }
                    else { kolomSelisih.innerText = "+" + selisih; kolomSelisih.className = "kolom-selisih diff-plus"; }
                }

                clearTimeout(firebaseTimeouts[originalIndex + '_fisik']);
                firebaseTimeouts[originalIndex + '_fisik'] = setTimeout(() => {
                    update(ref(db, `inventory_root/items/${originalIndex}`), { fisik: fisikValue });
                }, 500); 
            }
            
            if (e.target.classList.contains('input-remarks')) {
                const remarksValue = e.target.value;
                inventoryData[originalIndex].remarks = remarksValue;

                clearTimeout(firebaseTimeouts[originalIndex + '_remarks']);
                firebaseTimeouts[originalIndex + '_remarks'] = setTimeout(() => {
                    update(ref(db, `inventory_root/items/${originalIndex}`), { remarks: remarksValue });
                }, 500);
            }
        });

        function applySearchAndRender() {
            const filter = document.getElementById('searchInput').value.toLowerCase();
            filteredData = inventoryData
                .map((item, index) => ({ ...item, originalIndex: index }))
                .filter(item => {
                    return item.partNo.toLowerCase().includes(filter) || item.deskripsi.toLowerCase().includes(filter);
                });
            currentPage = 1;
            renderTablePage();
        }

        let searchTimeout;
        document.getElementById('searchInput').addEventListener('input', () => { clearTimeout(searchTimeout); searchTimeout = setTimeout(applySearchAndRender, 150); });
        document.getElementById('btnPrev').addEventListener('click', () => { if (currentPage > 1) { currentPage--; renderTablePage(); window.scrollTo(0,0); } });
        document.getElementById('btnNext').addEventListener('click', () => { const maxPage = Math.ceil(filteredData.length / rowsPerPage); if (currentPage < maxPage) { currentPage++; renderTablePage(); window.scrollTo(0,0); } });

        function splitIntoColumns(rowText) {
            return rowText.includes('\t') ? rowText.split('\t') : rowText.split(/\s{2,}/).map(p => p.trim()).filter(p => p !== "");
        }

        // 5. Fitur Paste Data Baru dengan 3 Tingkat Dialog Proteksi Data yang Aman
        document.getElementById('btnPaste').addEventListener('click', async function() {
            let text = "";
            try {
                text = await navigator.clipboard.readText();
            } catch (err) {
                text = prompt("Akses klipboard otomatis diblokir browser.\nSilakan tekan CTRL+V di kotak bawah ini lalu klik OK:");
            }

            if (!text || !text.trim()) return;

            const adaDataLama = inventoryData.length > 0;
            const adaFisikLama = inventoryData.some(item => item.fisik !== undefined && item.fisik !== null && item.fisik !== "");
            const adaRemarksLama = inventoryData.some(item => item.remarks && item.remarks.trim() !== "");

            let perbaruiStokSistem = true;
            let hapusFisikLama = false;
            let izinkanTimpaRemarks = true;

            if (adaDataLama) {
                perbaruiStokSistem = confirm("Ditemukan data lama di cloud.\n\nKlik 'OK' jika ingin MEMPERBARUI STOK SISTEM dengan data Excel.\nKlik 'Batal' jika ingin MEMPERTAHANKAN angka stok sistem yang sekarang.");
                if (adaFisikLama) {
                    hapusFisikLama = confirm("Ditemukan DATA FISIK lama di cloud.\n\nKlik 'OK' jika ingin MENGHAPUS/RESET data fisik lama.\nKlik 'Batal' jika ingin MEMPERTAHANKAN data fisik lama Anda.");
                }
                if (adaRemarksLama) {
                    izinkanTimpaRemarks = confirm("Ditemukan CATATAN (Remarks) lama di cloud.\n\nKlik 'OK' jika ingin MENIMPA semua catatan lama.\nKlik 'Batal' jika ingin MEMPERTAHANKAN semua catatan lama Anda.");
                }
            }

            const barisData = text.replace(/\r/g, "").split("\n");
            let dataHasilSinkronisasi = JSON.parse(JSON.stringify(inventoryData));

            barisData.forEach(baris => {
                const cleanBaris = baris.trim();
                if (!cleanBaris) return;
                const kolom = splitIntoColumns(cleanBaris);
                
                if (kolom.length >= 2) {
                    if (kolom[0].toLowerCase().includes("part no") || kolom[1].toLowerCase().includes("desc")) return;
                    
                    const targetPartNo = kolom[0].trim();
                    let cleanStokSistem = 0;
                    
                    if (kolom.length >= 8) {
                        cleanStokSistem = parseFloat(kolom[5].replace(/,/g, '')) || 0;
                    } else if (kolom.length === 7) {
                        cleanStokSistem = parseFloat(kolom[6].replace(/,/g, '')) || 0;
                    } else {
                        cleanStokSistem = parseFloat(kolom[kolom.length - 1].replace(/,/g, '')) || 0;
                    }

                    const indexItemLama = dataHasilSinkronisasi.findIndex(i => i.partNo === targetPartNo);

                    if (indexItemLama !== -1) {
                        dataHasilSinkronisasi[indexItemLama].deskripsi = kolom[1] ? kolom[1].trim() : dataHasilSinkronisasi[indexItemLama].deskripsi;
                        dataHasilSinkronisasi[indexItemLama].group = kolom[2] ? kolom[2].trim() : dataHasilSinkronisasi[indexItemLama].group;
                        dataHasilSinkronisasi[indexItemLama].type = kolom[3] ? kolom[3].trim() : dataHasilSinkronisasi[indexItemLama].type;
                        dataHasilSinkronisasi[indexItemLama].unit = kolom[4] ? kolom[4].trim() : dataHasilSinkronisasi[indexItemLama].unit;
                        
                        if (perbaruiStokSistem) dataHasilSinkronisasi[indexItemLama].sistem = cleanStokSistem;
                        if (hapusFisikLama) dataHasilSinkronisasi[indexItemLama].fisik = (kolom.length >= 8 && kolom[6] !== "" && kolom[6] !== "0") ? parseFloat(kolom[6]) : "";
                        if (izinkanTimpaRemarks) dataHasilSinkronisasi[indexItemLama].remarks = (kolom.length >= 9 && kolom[8]) ? kolom[8].trim() : "";
                    } else {
                        let fisikBaru = ""; let remarksBaru = "";
                        if (kolom.length >= 8 && kolom[6] !== "" && kolom[6] !== "0") fisikBaru = parseFloat(kolom[6]);
                        if (kolom.length >= 9 && kolom[8]) remarksBaru = kolom[8].trim();

                        dataHasilSinkronisasi.push({
                            partNo: targetPartNo,
                            deskripsi: kolom[1] ? kolom[1].trim() : "-",
                            group: kolom[2] ? kolom[2].trim() : "-",
                            type: kolom[3] ? kolom[3].trim() : "-",
                            unit: kolom[4] ? kolom[4].trim() : "-",
                            sistem: cleanStokSistem,
                            fisik: fisikBaru,
                            remarks: remarksBaru,
                            imageUrl: "" 
                        });
                    }
                }
            });

            if (dataHasilSinkronisasi.length > 0) {
                const opsiTanggal = { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute:'2-digit' };
                const waktuSkrg = new Date().toLocaleDateString('id-ID', opsiTanggal) + " WITA";
                
                isInitialLoad = true; 
                set(ref(db, 'inventory_root'), { items: dataHasilSinkronisasi, lastUpdate: waktuSkrg })
                    .then(() => alert(`Berhasil sinkronisasi. Total data di Cloud sekarang: ${dataHasilSinkronisasi.length} item.`))
                    .catch(err => alert("Gagal mengunggah! Periksa Rules Firebase Anda."));
            } else {
                alert("Data tidak dikenali. Pastikan Anda telah menyalin baris tabel dari Excel.");
            }
        });

        // Fungsi Logika Modal Form Tambah Data Manual
        const modal = document.getElementById("addModal");
        document.getElementById("btnOpenModal").addEventListener("click", () => { modal.style.display = "flex"; document.getElementById("formPartNo").focus(); });
        document.getElementById("btnCloseModal").addEventListener("click", () => { modal.style.display = "none"; });

        document.getElementById("btnSaveModal").addEventListener("click", () => {
            const partNo = document.getElementById("formPartNo").value.trim();
            const deskripsi = document.getElementById("formDeskripsi").value.trim();
            const group = document.getElementById("formGroup").value.trim();
            const type = document.getElementById("formType").value.trim();
            const unit = document.getElementById("formUnit").value.trim();
            const sistem = parseFloat(document.getElementById("formSistem").value) || 0;

            if (!partNo || !deskripsi) {
                alert("Kolom Part No dan Deskripsi Barang wajib diisi!");
                return;
            }

            const itemBaru = { partNo, deskripsi, group, type, unit, sistem, fisik: "", remarks: "", imageUrl: "" };
            inventoryData.push(itemBaru);

            const opsiTanggal = { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute:'2-digit' };
            const waktuSkrg = new Date().toLocaleDateString('id-ID', opsiTanggal) + " WITA";

            set(ref(db, 'inventory_root'), { items: inventoryData, lastUpdate: waktuSkrg })
                .then(() => {
                    modal.style.display = "none";
                    document.getElementById("formPartNo").value = "";
                    document.getElementById("formDeskripsi").value = "";
                    document.getElementById("formGroup").value = "";
                    document.getElementById("formUnit").value = "";
                    document.getElementById("formSistem").value = "0";
                    
                    applySearchAndRender();
                    alert("Item baru berhasil ditambahkan secara permanen!");
                });
        });

        document.getElementById('btnCopy').addEventListener('click', function() {
            if (inventoryData.length === 0) { alert("Tidak ada data."); return; }
            let tsvContent = "Part No.\tDeskripsi\tGroup Name\tItem Type\tUnit\tStok Sistem\tFisik\tSelisih\tRemarks\n";
            inventoryData.forEach(item => {
                const fisikVal = (item.fisik !== undefined && item.fisik !== null && item.fisik !== "") ? item.fisik : "0";
                const remarksTxt = item.remarks ? item.remarks : "";
                let selisihVal = "0";
                if (item.fisik !== undefined && item.fisik !== null && item.fisik !== "") {
                    const calc = item.fisik - item.sistem;
                    selisihVal = calc > 0 ? "+" + calc : calc;
                }
                tsvContent += `${item.partNo}\t${item.deskripsi}\t${item.group}\t${item.type}\t${item.unit}\t${item.sistem}\t${fisikVal}\t${selisihVal}\t${remarksTxt}\n`;
            });
            navigator.clipboard.writeText(tsvContent).then(() => {
                const btn = document.getElementById('btnCopy'); btn.innerText = "✅ Berhasil Disalin!";
                setTimeout(() => { btn.innerText = "📋 Salin Hasil Opname"; }, 2000);
            });
        });

        document.getElementById('btnReset').addEventListener('click', function() {
            if (confirm("Apakah Anda yakin ingin mengosongkan cloud? Data lama akan terhapus selamanya.")) {
                isInitialLoad = true;
                set(ref(db, 'inventory_root'), null)
                    .then(() => alert("Cloud berhasil dikosongkan!"))
                    .catch(err => alert("Gagal menghapus cloud! Periksa Rules Firebase."));
            }
        });
    </script>
</body>
</html>
