<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS System - Fitur Kamera & Upload</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 p-6">

    <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden md:max-w-2xl p-6">
        <h2 class="text-2xl font-bold mb-4 text-gray-800 text-center">Input Item POS & Kamera</h2>
        
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Nama Item / Produk</label>
                <input type="text" id="nama_item" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Masukkan nama produk">
            </div>

            <div class="border-2 border-dashed border-gray-300 rounded-lg p-4 text-center">
                <span class="block text-sm font-medium text-gray-700 mb-2">Ambil Foto Produk</span>
                
                <video id="video" class="w-full max-h-60 bg-black rounded-lg mb-2 hidden" autoplay playsinline></video>
                
                <canvas id="canvas" class="w-full max-h-60 bg-gray-200 rounded-lg mb-2 hidden"></canvas>

                <div class="flex justify-center gap-2 mt-2">
                    <button type="button" id="btn-aktifkan" class="bg-blue-600 text-white px-4 py-2 rounded shadow hover:bg-blue-700">Aktifkan Kamera</button>
                    <button type="button" id="btn-ambil" class="bg-green-600 text-white px-4 py-2 rounded shadow hover:bg-green-700 hidden">Ambil Foto</button>
                    <button type="button" id="btn-ulang" class="bg-yellow-600 text-white px-4 py-2 rounded shadow hover:bg-yellow-700 hidden">Foto Ulang</button>
                </div>
            </div>

            <button type="button" id="btn-upload" class="w-full bg-indigo-600 text-white p-3 rounded-lg font-bold shadow hover:bg-indigo-700 disabled:bg-gray-400" disabled>
                Simpan & Upload ke Database
            </button>
            
            <p id="status" class="text-sm text-center mt-2 font-medium"></p>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const btnAktifkan = document.getElementById('btn-aktifkan');
        const btnAmbil = document.getElementById('btn-ambil');
        const btnUlang = document.getElementById('btn-ulang');
        const btnUpload = document.getElementById('btn-upload');
        const statusText = document.getElementById('status');

        let streamData = null;
        let blobGambar = null; // Menyimpan data gambar yang siap diupload

        // 1. Mengaktifkan Kamera HP / Laptop
        btnAktifkan.addEventListener('click', async () => {
            try {
                statusText.innerText = "Membuka kamera...";
                streamData = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" }, // Prioritaskan kamera belakang kalau di HP
                    audio: false 
                });
                video.srcObject = streamData;
                video.classList.remove('hidden');
                canvas.classList.add('hidden');
                
                btnAktifkan.classList.add('hidden');
                btnAmbil.classList.remove('hidden');
                statusText.innerText = "";
            } catch (err) {
                console.error(err);
                statusText.innerText = "Gagal mengakses kamera. Pastikan izin kamera diberikan.";
                statusText.className = "text-sm text-center mt-2 font-medium text-red-600";
            }
        });

        // 2. Mengambil Foto (Freeze Frame)
        btnAmbil.addEventListener('click', () => {
            const context = canvas.getContext('2d');
            // Set ukuran canvas sesuai resolusi video
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            // Gambar video ke dalam canvas
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // Sembunyikan video, tampilkan hasil canvas
            video.classList.add('hidden');
            canvas.classList.remove('hidden');
            
            btnAmbil.classList.add('hidden');
            btnUlang.classList.remove('hidden');
            btnUpload.disabled = false; // Aktifkan tombol upload

            // Matikan stream kamera biar hemat baterai kanda
            if (streamData) {
                streamData.getTracks().forEach(track => track.stop());
            }

            // Ubah canvas menjadi Blob File JPEG untuk dikirim nanti
            canvas.toBlob((blob) => {
                blobGambar = blob;
            }, 'image/jpeg', 0.9);
        });

        // 3. Reset / Foto Ulang
        btnUlang.addEventListener('click', () => {
            blobGambar = null;
            btnUpload.disabled = true;
            btnUlang.classList.add('hidden');
            btnAktifkan.click(); // Klik otomatis tombol aktifkan kamera kembali
        });

        // 4. Proses Upload via Fetch API ke Laravel Backend
        btnUpload.addEventListener('click', async () => {
            const namaItem = document.getElementById('nama_item').value;
            
            if (!namaItem) {
                alert("Nama item tidak boleh kosong kanda!");
                return;
            }
            if (!blobGambar) {
                alert("Silakan ambil foto produk terlebih dahulu!");
                return;
            }

            // Bungkus data ke FormData (seperti form upload biasa)
            const formData = new FormData();
            formData.append('nama_item', namaItem);
            formData.append('image', blobGambar, 'foto_produk.jpg');

            try {
                btnUpload.disabled = true;
                statusText.innerText = "Sedang mengunggah ke database...";
                statusText.className = "text-sm text-center mt-2 font-medium text-blue-600";

                // Sesuaikan URL ini dengan endpoint API Laravel kanda
                const response = await fetch('http://localhost:8000/api/pos/upload', {
                    method: 'POST',
                    body: formData,
                    // Jika pakai Laravel Laravel CSRF/Token, tambahkan headers jika perlu. 
                    // Tapi kalau murni API route, biasanya tidak perlu.
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    statusText.innerText = "Sukses! Data dan Gambar tersimpan di database.";
                    statusText.className = "text-sm text-center mt-2 font-medium text-green-600";
                    
                    // Reset Form setelah berhasil kanda
                    document.getElementById('nama_item').value = "";
                    canvas.classList.add('hidden');
                    btnUlang.classList.add('hidden');
                    btnAktifkan.classList.remove('hidden');
                    blobGambar = null;
                } else {
                    throw new Error(result.message || "Gagal upload");
                }

            } catch (error) {
                console.error(error);
                statusText.innerText = "Error: " + error.message;
                statusText.className = "text-sm text-center mt-2 font-medium text-red-600";
                btnUpload.disabled = false;
            }
        });
    </script>
</body>
</html>
